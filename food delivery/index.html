
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBite - Food Delivery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #fffaf5;
    color: #292929;
}

header {
    background: #ff5a36;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

header h1 {
    font-size: 28px;
}

header button {
    background: white;
    color: #ff5a36;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.hero {
    padding: 45px 7%;
    background: #fff0e8;
    text-align: center;
}

.hero h2 {
    font-size: 34px;
    margin-bottom: 12px;
}

.hero p {
    margin-bottom: 20px;
    color: #666;
}

.search {
    width: 90%;
    max-width: 450px;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

section {
    padding: 35px 7%;
}

section h2 {
    margin-bottom: 22px;
}

.restaurant-list,
.menu-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 22px;
}

.card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px #00000012;
    border: 1px solid #f0e9e4;
}

.card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
}

.card-content {
    padding: 16px;
}

.card h3 {
    margin-bottom: 8px;
}

.card p {
    color: #666;
    margin-bottom: 12px;
    font-size: 14px;
}

.price {
    font-weight: bold;
    color: #e64c2e;
    margin-bottom: 12px;
}

.action {
    background: #ff5a36;
    color: white;
    padding: 10px 14px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.action:hover {
    background: #df4324;
}

.secondary {
    background: #555;
    color: white;
    padding: 9px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

#menuSection, #cartSection {
    display: none;
}

#cartItems {
    display: grid;
    gap: 12px;
    margin-bottom: 20px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: white;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #eee;
}

.cart-item button {
    padding: 5px 9px;
    cursor: pointer;
}

#checkoutForm {
    display: grid;
    gap: 12px;
    max-width: 450px;
}

#checkoutForm input,
#checkoutForm textarea {
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    width: 100%;
    font-size: 15px;
}

#message {
    margin-top: 15px;
    color: #18834a;
    font-weight: bold;
}

.back {
    margin-bottom: 20px;
}

footer {
    text-align: center;
    background: #292929;
    color: white;
    padding: 22px;
    margin-top: 30px;
}

@media (max-width: 600px) {
    header {
        padding: 18px 5%;
    }

    .hero h2 {
        font-size: 27px;
    }

    section {
        padding: 28px 5%;
    }
}
</style>
</head>

<body>

<header>
    <h1>QuickBite</h1>
    <button onclick="showCart()">
        Cart (<span id="cartCount">0</span>)
    </button>
</header>

<div class="hero">
    <h2>Hungry? Order Your Favourite Food!</h2>
    <p>Choose a restaurant and enjoy delicious food.</p>
    <input
        class="search"
        id="searchInput"
        type="text"
        placeholder="Search restaurants..."
        oninput="searchRestaurants()"
    >
</div>

<section id="restaurantSection">
    <h2>Popular Restaurants</h2>
    <div class="restaurant-list" id="restaurantList"></div>
</section>

<section id="menuSection">
    <button class="secondary back" onclick="showRestaurants()">
        ← Back to Restaurants
    </button>
    <h2 id="restaurantTitle">Restaurant Menu</h2>
    <div class="menu-list" id="menuList"></div>
</section>

<section id="cartSection">
    <button class="secondary back" onclick="showRestaurants()">
        ← Continue Shopping
    </button>

    <h2>Your Shopping Cart</h2>
    <div id="cartItems"></div>
    <h3>Total: ₹<span id="cartTotal">0</span></h3>

    <h2 style="margin-top: 30px;">Delivery Details</h2>

    <form id="checkoutForm">
        <input id="customerName" type="text"
            placeholder="Your Name" required>

        <input id="phone" type="tel"
            placeholder="Phone Number" pattern="[0-9]{10}" required>

        <textarea id="address" rows="3"
            placeholder="Delivery Address" required></textarea>

        <button class="action" type="submit">
            Place Order
        </button>
    </form>

    <p id="message"></p>
</section>

<footer>
    <p>QuickBite - Fresh Food, Delivered Fast!</p>
</footer>

<script>
const restaurants = [
    {
        id: 1,
        name: "South Indian Kitchen",
        cuisine: "South Indian • Veg & Non-Veg",
        rating: "4.5",
        image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=600",
        menu: [
            { id: 101, name: "Masala Dosa", price: 80,
              image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=500" },
            { id: 102, name: "Idli (2 pieces)", price: 40,
              image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=500" },
            { id: 103, name: "Veg Meals", price: 120,
              image: "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=500" }
        ]
    },
    {
        id: 2,
        name: "Spice Garden",
        cuisine: "Indian • Biryani & Meals",
        rating: "4.7",
        image: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=600",
        menu: [
            { id: 201, name: "Chicken Biryani", price: 180,
              image: "https://images.unsplash.com/photo-1563379091339-03246963d96c?w=500" },
            { id: 202, name: "Veg Biryani", price: 130,
              image: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=500" },
            { id: 203, name: "Paneer Butter Masala", price: 160,
              image: "https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=500" }
        ]
    },
    {
        id: 3,
        name: "Pizza House",
        cuisine: "Pizza • Italian",
        rating: "4.3",
        image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600",
        menu: [
            { id: 301, name: "Margherita Pizza", price: 199,
              image: "https://images.unsplash.com/photo-1579751626657-72bc17010498?w=500" },
            { id: 302, name: "Farmhouse Pizza", price: 249,
              image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500" },
            { id: 303, name: "Garlic Bread", price: 99,
              image: "https://images.unsplash.com/photo-1573140247632-f8fd74997d5c?w=500" }
        ]
    },
    {
        id: 4,
        name: "Burger Hub",
        cuisine: "Burgers • Fast Food",
        rating: "4.2",
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600",
        menu: [
            { id: 401, name: "Veg Burger", price: 99,
              image: "https://images.unsplash.com/photo-1520072959219-c595dc870360?w=500" },
            { id: 402, name: "Cheese Burger", price: 149,
              image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
            { id: 403, name: "French Fries", price: 79,
              image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500" }
        ]
    }
];

let cart = [];
let selectedRestaurant = null;

function renderRestaurants(list = restaurants) {
    const container = document.getElementById("restaurantList");
    container.innerHTML = "";

    if (list.length === 0) {
        container.innerHTML = "<p>No restaurants found.</p>";
        return;
    }

    list.forEach(restaurant => {
        container.innerHTML += `
            <div class="card">
                <img src="${restaurant.image}" alt="${restaurant.name}">
                <div class="card-content">
                    <h3>${restaurant.name}</h3>
                    <p>${restaurant.cuisine}</p>
                    <p>Rating: ${restaurant.rating} / 5</p>
                    <button class="action"
                        onclick="openRestaurant(${restaurant.id})">
                        View Menu
                    </button>
                </div>
            </div>`;
    });
}

function searchRestaurants() {
    const value = document.getElementById("searchInput")
        .value.toLowerCase();

    const filtered = restaurants.filter(r =>
        r.name.toLowerCase().includes(value) ||
        r.cuisine.toLowerCase().includes(value)
    );

    renderRestaurants(filtered);
}

function openRestaurant(id) {
    selectedRestaurant = restaurants.find(r => r.id === id);

    document.getElementById("restaurantSection").style.display = "none";
    document.getElementById("cartSection").style.display = "none";
    document.getElementById("menuSection").style.display = "block";

    document.getElementById("restaurantTitle").textContent =
        selectedRestaurant.name + " - Menu";

    const container = document.getElementById("menuList");
    container.innerHTML = "";

    selectedRestaurant.menu.forEach(item => {
        container.innerHTML += `
            <div class="card">
                <img src="${item.image}" alt="${item.name}">
                <div class="card-content">
                    <h3>${item.name}</h3>
                    <p class="price">₹${item.price}</p>
                    <button class="action"
                        onclick="addToCart(${selectedRestaurant.id}, ${item.id})">
                        Add to Cart
                    </button>
                </div>
            </div>`;
    });

    document.getElementById("message").textContent = "";
    window.scrollTo(0, 0);
}

function addToCart(restaurantId, itemId) {
    if (cart.length > 0 && cart[0].restaurantId !== restaurantId) {
        alert("Please order from one restaurant at a time. Clear your cart to switch restaurants.");
        return;
    }

    const restaurant = restaurants.find(r => r.id === restaurantId);
    const item = restaurant.menu.find(i => i.id === itemId);
    const existing = cart.find(i => i.id === itemId);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({
            ...item,
            restaurantId: restaurantId,
            quantity: 1
        });
    }

    updateCart();
}

function updateCart() {
    document.getElementById("cartCount").textContent =
        cart.reduce((sum, item) => sum + item.quantity, 0);

    const container = document.getElementById("cartItems");
    container.innerHTML = "";

    if (cart.length === 0) {
        container.innerHTML = "<p>Your cart is empty.</p>";
    }

    cart.forEach(item => {
        container.innerHTML += `
            <div class="cart-item">
                <div>
                    <strong>${item.name}</strong>
                    <p>₹${item.price} × ${item.quantity}</p>
                </div>
                <div>
                    <button onclick="changeQuantity(${item.id}, -1)">−</button>
                    <span>${item.quantity}</span>
                    <button onclick="changeQuantity(${item.id}, 1)">+</button>
                </div>
            </div>`;
    });

    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity, 0
    );

    document.getElementById("cartTotal").textContent = total;
}

function changeQuantity(itemId, change) {
    const item = cart.find(i => i.id === itemId);
    if (!item) return;

    item.quantity += change;

    if (item.quantity <= 0) {
        cart = cart.filter(i => i.id !== itemId);
    }

    updateCart();
}

function showCart() {
    document.getElementById("restaurantSection").style.display = "none";
    document.getElementById("menuSection").style.display = "none";
    document.getElementById("cartSection").style.display = "block";

    document.getElementById("message").textContent = "";
    updateCart();
    window.scrollTo(0, 0);
}

function showRestaurants() {
    document.getElementById("restaurantSection").style.display = "block";
    document.getElementById("menuSection").style.display = "none";
    document.getElementById("cartSection").style.display = "none";
    document.getElementById("message").textContent = "";
    window.scrollTo(0, 0);
}

document.getElementById("checkoutForm").addEventListener("submit", function(event) {
    event.preventDefault();

    if (cart.length === 0) {
        alert("Please add food to your cart before placing an order.");
        return;
    }

    const name = document.getElementById("customerName").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();

    if (!name || !phone || !address) {
        alert("Please fill in all delivery details.");
        return;
    }

    const orderId = "QB" + Date.now().toString().slice(-6);
    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity, 0
    );

    document.getElementById("message").textContent =
        "Order placed successfully! Order ID: " + orderId +
        ". Total: ₹" + total +
        ". Thank you, " + name + "! (Demo order only)";

    cart = [];
    updateCart();
    this.reset();
});

renderRestaurants();
updateCart();
</script>

</body>
</html>
